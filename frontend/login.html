<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión | DJ GUSTAVO</title>

    <link rel="stylesheet"
    href="css/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<section class="login-container">

    <div class="login-card">

        <h1>DJ GUSTAVO</h1>

        <p>
            Inicia sesión para reservar eventos,
            comprar productos y administrar tu carrito.
        </p>

        <form id="loginForm">

            <input
            type="text"
            id="username"
            placeholder="Usuario"
            required>

            <input
            type="password"
            id="password"
            placeholder="Contraseña"
            required>

            <button
            type="submit"
            class="btn-neon">

                <i class="fas fa-right-to-bracket"></i>

                Iniciar Sesión

            </button>

        </form>

        <div style="margin-top:25px;">

            <p>
                ¿No tienes una cuenta?
            </p>

            <br>

            <a href="registro.html">

                <button
                type="button"
                class="btn-outline">

                    <i class="fas fa-user-plus"></i>

                    Crear Cuenta

                </button>

            </a>

        </div>

        <div style="margin-top:15px;">

            <a href="index.html">

                <button
                type="button"
                class="btn-outline">

                    <i class="fas fa-house"></i>

                    Volver al Inicio

                </button>

            </a>

        </div>

        <div style="margin-top:25px;">

            <h3>
                Accede a:
            </h3>

            <br>

            <p>

                🎵 Reservas de eventos

                <br><br>

                🛒 Tienda DJ

                <br><br>

                🎧 Carrito de compras

                <br><br>

                🔐 Funciones exclusivas para usuarios registrados

            </p>

        </div>

    </div>

</section>

<script src="js/login.js"></script>

</body>

</html>
