    <title>Reservas DJ</title>

    <!-- CSS -->
    <link rel="stylesheet"
    href="css/style.css">

    <!-- FONT AWESOME -->

    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <a href="index.html" class="logo">

    <section class="contact">

        <h2>
            Reservar Evento
        </h2>

        <p>
            Agenda tu evento y vive una experiencia inolvidable.
        </p>

        <form class="formulario">

            <input

            placeholder="Nombre completo">

            <input

            placeholder="Correo electrónico">

            <input type="date">

            <textarea
            placeholder="Detalles del evento">

                Reservar
            </button>

        </form>

    </section>

    <!-- BOTON TOP -->
