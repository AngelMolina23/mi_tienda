<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Crear Cuenta | DJ GUSTAVO</title>

    <link rel="stylesheet"
    href="css/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<section class="login-container">

    <div class="login-card">

        <h1>DJ GUSTAVO</h1>

        <p>
            Crea una cuenta para reservar eventos,
            comprar productos DJ y administrar tus pedidos.
        </p>

        <form id="registroForm">

            <input
            type="text"
            id="username"
            placeholder="Nombre de usuario"
            required>

            <input
            type="email"
            id="email"
            placeholder="Correo electrónico"
            required>

            <input
            type="text"
            id="phone"
            placeholder="Número telefónico"
            required>

            <input
            type="password"
            id="password"
            placeholder="Contraseña"
            required>

            <input
            type="password"
            id="confirmPassword"
            placeholder="Confirmar contraseña"
            required>

            <button
            type="submit"
            class="btn-neon">

                <i class="fas fa-user-plus"></i>

                Crear Cuenta

            </button>

        </form>

        <div style="margin-top:25px;">

            <a href="login.html">

                <button
                type="button"
                class="btn-outline">

                    <i class="fas fa-right-to-bracket"></i>

                    Ya tengo cuenta

                </button>

            </a>

        </div>

        <div style="margin-top:15px;">

            <a href="index.html">

                <button
                type="button"
                class="btn-outline">

                    <i class="fas fa-house"></i>

                    Volver al Inicio

                </button>

            </a>

        </div>

        <div style="margin-top:25px;">

            <h3>
                Beneficios de tu cuenta
            </h3>

            <br>

            <p>

                ✅ Reservar eventos online

                <br><br>

                ✅ Comprar productos DJ

                <br><br>

                ✅ Gestionar tu carrito

                <br><br>

                ✅ Acceder a promociones futuras

            </p>

        </div>

    </div>

</section>

<script src="js/registro.js"></script>

</body>

</html>
